<mat-card appearance="outlined">
  <img mat-card-image [src]="product.thumbnail" [alt]="product.title" />
  <mat-card-header>
    <mat-card-title>{{ product.title }}</mat-card-title>
    <mat-card-subtitle>{{ product.price | currency : 'EUR' }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button [routerLink]="['/products', product.id]">Dettagli</button>
    <button mat-flat-button color="primary" (click)="add.emit(product)">
      <mat-icon aria-hidden="true">add_shopping_cart</mat-icon>
      Aggiungi
    </button>
  </mat-card-actions>
</mat-card>
