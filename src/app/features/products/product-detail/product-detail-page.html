<ng-container *ngIf="product$ | async as product">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ product.title }}</mat-card-title>
      <mat-card-subtitle>
        <span *ngIf="product.sale" class="price-sale">
          {{ product.price | currency : 'EUR' }}
        </span>
        <span *ngIf="!product.sale">
          {{ product.price | currency : 'EUR' }}
        </span>
        <span *ngIf="product.sale" class="price-original">
          {{ product.originalPrice | currency : 'EUR' }}
        </span>
      </mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image [src]="product.thumbnail" [alt]="product.title" />
    <mat-card-content>
      <p>{{ product.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" routerLink="/products">
        Torna al catalogo
      </button>
    </mat-card-actions>
  </mat-card>
</ng-container>
