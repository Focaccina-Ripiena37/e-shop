name: DAST

# OWASP ZAP baseline scan against the API running via docker compose.
# Reports are uploaded as artifacts; the job does not block on findings yet.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate a JWT signing key for this test run
        run: |
          jwt_key="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_key"
          echo "JWT_SECRET_KEY=$jwt_key" >> "$GITHUB_ENV"

      - name: Boot database and backend
        run: docker compose up -d --wait db backend

      - name: Run OWASP ZAP baseline scan against the API
        run: |
          docker run --rm --network eshop-network -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://backend:3001 \
            -J zap-results.json -w zap-report.md || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap-report.md

      - name: Stop services
        if: always()
        run: docker compose down -v
