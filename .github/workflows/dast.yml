name: DAST

# OWASP ZAP baseline scan against the API running via docker compose.
# Reports are uploaded as artifacts; the job does not block on findings yet.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate a JWT signing key for this test run
        run: |
          jwt_key="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_key"
          echo "JWT_SECRET_KEY=$jwt_key" >> "$GITHUB_ENV"

      - name: Boot database and backend
        run: |
          docker compose up -d --wait db backend
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 2 --max-time 5 http://localhost:3001/up

      - name: Run OWASP ZAP baseline scan against the API
        run: |
          install -d -m 0777 "$RUNNER_TEMP/zap-reports"
          docker run --rm --network eshop-network \
            -v "$RUNNER_TEMP/zap-reports:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://backend:3001/api/products -I \
            -J zap-results.json -w zap-report.md

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap-reports/
          if-no-files-found: error

      - name: Stop services
        if: always()
        run: docker compose down -v
